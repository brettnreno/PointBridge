name: Publish release candidate

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release candidate tag matching the project version (for example v1.2.1-rc.1)'
        required: true
        type: string
        default: v1.2.8-rc.1

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CANDIDATE_TAG: ${{ inputs.tag || github.ref_name }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release candidate version
        run: |
          $ErrorActionPreference = 'Stop'
          $project = [xml](Get-Content app/apiTool.csproj -Raw)
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:CANDIDATE_TAG -notmatch ('^v' + [regex]::Escape($version) + '-rc\.[1-9][0-9]*$')) {
            throw "Candidate tag must match the project version: v$version-rc.N"
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Test and build the Windows installer
        run: ./scripts/Build.ps1
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: artifacts/packages/*
      - name: Publish verified installer and bundle on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $referenceJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:CANDIDATE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $reference = ($referenceJson | ConvertFrom-Json).object
            while ($reference.type -eq 'tag') {
              $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($reference.sha)"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve candidate tag.' }
              $reference = ($tagJson | ConvertFrom-Json).object
            }
            if ($reference.type -ne 'commit' -or $reference.sha -ne $env:GITHUB_SHA) {
              throw 'Candidate tag points to a different commit than the build. Choose a new candidate tag.'
            }
          }
          $assets = @(Get-ChildItem artifacts/packages -File | ForEach-Object { $_.FullName })
          if (!($assets | Where-Object { $_.EndsWith('.msi') }) -or !($assets | Where-Object { $_.EndsWith('.zip') })) {
            throw 'Installer or bundle missing; release will not be published.'
          }
          $notes = @"
          Windows x64 release candidate built from commit $env:GITHUB_SHA.

          Download the bundle ZIP under Assets for the installer, SHA256 checksums and installation/removal instructions. The MSI is also available separately.

          Release files have GitHub build-provenance attestations. Maintainers can verify a downloaded file with gh attestation verify FILE --repo $env:GITHUB_REPOSITORY. This supplements checksums; it is not Windows Authenticode signing.

          Requires a Windows Metasys server with local core services and Metasys UI installed. Complete Metasys sign-in setup locally after installation. Pause transfers before upgrading an existing installation.

          This build is unsigned. The operator has confirmed successful use on their installed Metasys environment. Automated regressions use fake endpoints; verify compatibility and restart behavior at each deployment. Independent Metasys health publishing remains uncommissioned. No credentials, local settings or test logs are attached.
          "@
          $candidateNotes = ((Get-Content app/RELEASE-NOTES.md -Raw) -split '(?m)^## Release', 2)[0]
          $notes += "`n`n$candidateNotes"
          $notesFile = Join-Path $env:RUNNER_TEMP 'pointbridge-release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $env:CANDIDATE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Point Bridge $env:CANDIDATE_TAG" --notes-file $notesFile --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed. Existing releases are never overwritten.' }
          $releaseUrl = gh release view $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published release.' }
          "## Release candidate`n`n[Download installer and bundle]($releaseUrl)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Retain build and synthetic-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PointBridge-release-logs-${{ github.run_number }}
          path: artifacts/logs/*
          if-no-files-found: warn
          retention-days: 14
